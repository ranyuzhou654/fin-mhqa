[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finmhqa"
version = "0.1.0"
description = "Evidence-grounded financial multi-hop question answering"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ingest = ["pymupdf>=1.24,<2", "pdfplumber>=0.11,<0.12", "transformers>=4.51,<5", "simhash>=2.1,<3"]
agent = ["langgraph==1.2.11", "jsonschema==4.26.0"]
service = ["fastapi==0.141.1", "uvicorn==0.52.4"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finmhqa.service" = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
